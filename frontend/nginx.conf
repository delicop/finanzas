server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React es una SPA: cualquier ruta desconocida debe devolver index.html
    # para que el enrutado del lado del cliente funcione al refrescar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y la página se revisan en cada visita: si quedaran
    # en caché, una versión nueva de la app no le llegaría nunca al teléfono.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Los assets con hash en el nombre se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
